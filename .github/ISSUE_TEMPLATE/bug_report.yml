name: Bug report
description: Report reproducible integration behavior using sanitized information.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include passwords, serial numbers, RTSP URLs, tokens, or camera images.
  - type: input
    id: version
    attributes:
      label: Integration version
      placeholder: 0.3.0
    validations:
      required: true
  - type: input
    id: home_assistant
    attributes:
      label: Home Assistant version
      placeholder: 2026.9.4
    validations:
      required: true
  - type: input
    id: architecture
    attributes:
      label: Host architecture
      placeholder: x86_64
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe expected and observed behavior.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Sanitized diagnostics or logs
      description: Review diagnostics manually before attaching them.
      render: text
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed credentials, serials, tokens, URLs, and camera images.
          required: true
