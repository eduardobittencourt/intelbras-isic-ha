name: Tests

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - home-assistant: "2026.9.4"
            test-harness: "0.13.367"
          - home-assistant: "2026.10.1"
            test-harness: "0.13.372"
    name: HA ${{ matrix.home-assistant }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
      - name: Install test dependencies
        run: >-
          python -m pip install -e '.[test]'
          'pytest-homeassistant-custom-component==${{ matrix.test-harness }}'
      - name: Check dependency consistency
        run: python -m pip check
      - name: Run Ruff
        run: |
          ruff check .
          ruff format --check .
      - name: Run tests
        run: pytest
