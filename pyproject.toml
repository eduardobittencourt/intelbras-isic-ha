[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "intelbras-isic-ha"
version = "0.3.2"
description = "Intelbras iSIC Cloud custom integration for Home Assistant"
readme = "README.md"
requires-python = ">=3.14.2"
license = "MIT"
authors = [{name = "Eduardo Bittencourt"}]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3.14",
]

[project.optional-dependencies]
test = [
  "av==17.0.1",
  "ha-ffmpeg==3.2.2",
  "numpy==2.5.3",
  "pre-commit==4.3.0",
  "PyTurboJPEG==1.8.3",
  "pytest-cov==7.1.0",
  "pytest-homeassistant-custom-component==0.13.367",
  "ruff==0.13.2",
]

[tool.setuptools]
packages = []

[tool.pytest.ini_options]
addopts = "--strict-markers --cov=custom_components.intelbras_isic --cov-report=term-missing"
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]

[tool.coverage.run]
branch = true

[tool.coverage.report]
exclude_also = [
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]
show_missing = true

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = ["ASYNC", "B", "E", "F", "I", "PIE", "RUF", "SIM", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["custom_components.intelbras_isic"]
